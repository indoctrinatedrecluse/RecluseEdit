name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore Dependencies
        run: dotnet restore RecluseEdit.slnx

      - name: Run Test Suite
        run: dotnet test RecluseEdit.slnx -c Release --no-restore --verbosity normal

      - name: Build Solution & Extensions (Release)
        run: dotnet build RecluseEdit.slnx -c Release --no-restore

      - name: Package Distribution Archive
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag.StartsWith("refs/")) {
            $tag = "${{ inputs.tag_name }}"
            if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v1.0.0" }
          }

          $stagingDir = "package/RecluseEdit"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          # Copy main editor binaries and dependencies
          Copy-Item -Path "bin/Release/net10.0-windows/*" -Destination $stagingDir -Recurse -Force

          # Include License and documentation
          if (Test-Path "LICENSE") { Copy-Item -Path "LICENSE" -Destination $stagingDir -Force }
          if (Test-Path "README.md") { Copy-Item -Path "README.md" -Destination $stagingDir -Force }

          # Remove test binaries if copied
          if (Test-Path "$stagingDir/RecluseEdit.Tests.dll") {
            Remove-Item -Path "$stagingDir/RecluseEdit.Tests.*" -Force
          }

          # Create zip archive
          $zipFileName = "RecluseEdit-windows-$tag.zip"
          Compress-Archive -Path "package/RecluseEdit" -DestinationPath $zipFileName -Force

          Write-Host "Successfully generated distribution package: $zipFileName"
          echo "ZIP_FILE=$zipFileName" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_FILE }}
          path: ${{ env.ZIP_FILE }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create ${{ env.RELEASE_TAG }} ${{ env.ZIP_FILE }} `
            --title "RecluseEdit ${{ env.RELEASE_TAG }}" `
            --generate-notes
